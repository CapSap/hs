#
# immich on plain docker compose (migrated from swarm, july 2026)
#
# upstream reference — keep this file close to it so immich docs/troubleshooting apply:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# divergences from upstream, on purpose:
#   - db credentials via file-based secrets (*_FILE pattern) instead of plain env vars
#   - model-cache is a bind mount, not a named volume (keeps docker's data-root small)
#
# paths and version come from .env (gitignored, lives next to this file on the server)
# secret values are files under ./secrets/ (gitignored) — see migration-runbook.md

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    secrets:
      - immich_db_password
      - immich_db_username
      - immich_db_database_name
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=database
      - DB_PASSWORD_FILE=/run/secrets/immich_db_password
      - DB_USERNAME_FILE=/run/secrets/immich_db_username
      - DB_DATABASE_NAME_FILE=/run/secrets/immich_db_database_name
      - IMMICH_MEDIA_LOCATION=/usr/src/app/upload

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    restart: always
    healthcheck:
      disable: false
    environment:
      - TZ=${TZ}

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fec42f399876eb6faf9e008570597741c87ff7662a54185593e74b09ce83d177
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_USER_FILE: /run/secrets/immich_db_username
      POSTGRES_DB_FILE: /run/secrets/immich_db_database_name
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # the database now lives on the 14tb spinning disk
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
    secrets:
      - immich_db_password
      - immich_db_username
      - immich_db_database_name

secrets:
  immich_db_password:
    file: ./secrets/immich_db_password
  immich_db_username:
    file: ./secrets/immich_db_username
  immich_db_database_name:
    file: ./secrets/immich_db_database_name
